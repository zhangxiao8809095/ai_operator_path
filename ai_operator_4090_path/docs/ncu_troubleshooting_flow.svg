<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">NCU Troubleshooting Flow</title>
  <desc id="desc">A hand-copy friendly Nsight Compute troubleshooting flowchart from Duration to Launch Stats, SM versus Memory, DRAM, Occupancy, Scheduler Stall, Roofline, and back to Duration.</desc>
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <marker id="arrow-action" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d4f"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b86b18"/>
    </marker>
    <style>
      .bg { fill: #f7f8fa; }
      .title { fill: #17212b; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #52606d; font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #cfd7df; stroke-width: 2; rx: 14; }
      .decision { fill: #fff7ea; stroke: #d99a3d; stroke-width: 2; rx: 14; }
      .action { fill: #edf8f1; stroke: #66a77c; stroke-width: 2; rx: 14; }
      .result { fill: #eef4ff; stroke: #6d90d2; stroke-width: 2; rx: 14; }
      .roof { fill: #f6f3d8; stroke: #9a8f38; stroke-width: 2; rx: 14; }
      .node-title { fill: #16202a; font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node-text { fill: #52606d; font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #697784; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { fill: none; stroke: #263238; stroke-width: 2.5; marker-end: url(#arrow-main); }
      .edge-action { fill: none; stroke: #2f7d4f; stroke-width: 2.5; marker-end: url(#arrow-action); }
      .edge-warn { fill: none; stroke: #b86b18; stroke-width: 2.5; marker-end: url(#arrow-warn); }
      .label { fill: #263238; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label-warn { fill: #9a570f; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label-action { fill: #2f7d4f; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .legend-title { fill: #16202a; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .legend-text { fill: #52606d; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1180"/>
  <text class="title" x="80" y="70">NCU 处理问题流程图</text>
  <text class="subtitle" x="80" y="104">一条主干：先确认慢不慢，再判断开局配置、计算/内存压力、调度等待，最后用 Roofline 定方向，并回到 Duration 验证。</text>

  <g transform="translate(80,132)">
    <rect class="box" x="0" y="0" width="330" height="96"/>
    <text class="node-title" x="28" y="38">0. NCU Report</text>
    <text class="node-text" x="28" y="68">拿到报告，先别急着展开所有表</text>
  </g>

  <g transform="translate(80,268)">
    <rect class="result" x="0" y="0" width="330" height="104"/>
    <text class="node-title" x="28" y="38">1. Duration</text>
    <text class="node-text" x="28" y="70">真的慢吗？优化后是否变快？</text>
  </g>

  <g transform="translate(80,414)">
    <rect class="decision" x="0" y="0" width="330" height="126"/>
    <text class="node-title" x="28" y="38">2. Launch Stats</text>
    <text class="node-text" x="28" y="70">活派够了吗？</text>
    <text class="node-text" x="28" y="96">regs / smem / block 卡住了吗？</text>
  </g>

  <g transform="translate(520,414)">
    <rect class="action" x="0" y="0" width="300" height="126"/>
    <text class="node-title" x="28" y="38">先改开局配置</text>
    <text class="node-text" x="28" y="70">调 grid / block</text>
    <text class="node-text" x="28" y="96">降 regs / smem 压力</text>
  </g>

  <g transform="translate(80,610)">
    <rect class="decision" x="0" y="0" width="330" height="126"/>
    <text class="node-title" x="28" y="38">3. SM vs Memory</text>
    <text class="node-text" x="28" y="70">谁压力最高？</text>
    <text class="node-text" x="28" y="96">计算侧，还是内存侧？</text>
  </g>

  <g transform="translate(520,600)">
    <rect class="decision" x="0" y="0" width="310" height="132"/>
    <text class="node-title" x="28" y="38">4A. SM 高</text>
    <text class="node-text" x="28" y="70">计算瓶颈路径</text>
    <text class="node-text" x="28" y="98">查指令 / Tensor / 依赖</text>
  </g>

  <g transform="translate(960,600)">
    <rect class="decision" x="0" y="0" width="310" height="132"/>
    <text class="node-title" x="28" y="38">4B. Memory 高</text>
    <text class="node-text" x="28" y="70">内存瓶颈路径</text>
    <text class="node-text" x="28" y="98">继续拆 DRAM / cache</text>
  </g>

  <g transform="translate(960,790)">
    <rect class="decision" x="0" y="0" width="310" height="126"/>
    <text class="node-title" x="28" y="38">5. DRAM</text>
    <text class="node-text" x="28" y="70">DRAM 是否也高？</text>
    <text class="node-text" x="28" y="96">判断是不是片外显存瓶颈</text>
  </g>

  <g transform="translate(1310,735)">
    <rect class="action" x="0" y="0" width="250" height="106"/>
    <text class="node-title" x="22" y="36">DRAM 高</text>
    <text class="node-text" x="22" y="66">减字节 / 提复用</text>
    <text class="node-text" x="22" y="90">合并访问 / 融合</text>
  </g>

  <g transform="translate(1310,885)">
    <rect class="action" x="0" y="0" width="250" height="106"/>
    <text class="node-title" x="22" y="36">DRAM 不高</text>
    <text class="node-text" x="22" y="66">查 L1 / L2 / Shared</text>
    <text class="node-text" x="22" y="90">cache / bank / pipe</text>
  </g>

  <g transform="translate(520,790)">
    <rect class="decision" x="0" y="0" width="310" height="126"/>
    <text class="node-title" x="28" y="38">6. Occupancy</text>
    <text class="node-text" x="28" y="70">Throughput 都不高？</text>
    <text class="node-text" x="28" y="96">看 warp 够不够隐藏延迟</text>
  </g>

  <g transform="translate(520,970)">
    <rect class="decision" x="0" y="0" width="310" height="126"/>
    <text class="node-title" x="28" y="38">7. Scheduler / Stall</text>
    <text class="node-text" x="28" y="70">有 warp，但发不出？</text>
    <text class="node-text" x="28" y="96">查 long scoreboard / barrier / throttle</text>
  </g>

  <g transform="translate(960,970)">
    <rect class="roof" x="0" y="0" width="310" height="126"/>
    <text class="node-title" x="28" y="38">8. Roofline</text>
    <text class="node-text" x="28" y="70">方向不明或要总结时看</text>
    <text class="node-text" x="28" y="96">优化内存，还是优化计算？</text>
  </g>

  <g transform="translate(960,132)">
    <rect class="result" x="0" y="0" width="310" height="104"/>
    <text class="node-title" x="28" y="38">9. 回到 Duration</text>
    <text class="node-text" x="28" y="70">只用时间验证优化是否成立</text>
  </g>

  <g transform="translate(1310,92)">
    <rect class="box" x="0" y="0" width="250" height="190"/>
    <text class="legend-title" x="22" y="34">手绘颜色建议</text>
    <rect x="22" y="55" width="20" height="20" fill="#ffffff" stroke="#cfd7df" stroke-width="2" rx="4"/>
    <text class="legend-text" x="54" y="71">普通步骤</text>
    <rect x="22" y="88" width="20" height="20" fill="#fff7ea" stroke="#d99a3d" stroke-width="2" rx="4"/>
    <text class="legend-text" x="54" y="104">判断节点</text>
    <rect x="22" y="121" width="20" height="20" fill="#edf8f1" stroke="#66a77c" stroke-width="2" rx="4"/>
    <text class="legend-text" x="54" y="137">优化动作</text>
    <rect x="22" y="154" width="20" height="20" fill="#f6f3d8" stroke="#9a8f38" stroke-width="2" rx="4"/>
    <text class="legend-text" x="54" y="170">Roofline 方向判断</text>
  </g>

  <path class="edge" d="M245 228 L245 268"/>
  <path class="edge" d="M245 372 L245 414"/>
  <path class="edge" d="M245 540 L245 610"/>
  <path class="edge-warn" d="M410 477 L520 477"/>
  <text class="label-warn" x="438" y="462">有问题</text>
  <path class="edge-action" d="M670 414 C670 320 430 320 410 320"/>
  <text class="label-action" x="590" y="330">改完回测</text>

  <path class="edge-warn" d="M410 673 L520 666"/>
  <text class="label-warn" x="438" y="650">SM 高</text>
  <path class="edge-warn" d="M410 695 C610 735 760 735 960 666"/>
  <text class="label-warn" x="610" y="742">Memory 高</text>

  <path class="edge-action" d="M675 732 L675 790"/>
  <text class="label-action" x="690" y="770">否则看并行/调度</text>
  <path class="edge" d="M1115 732 L1115 790"/>
  <path class="edge-warn" d="M1270 825 L1310 788"/>
  <text class="label-warn" x="1280" y="792">高</text>
  <path class="edge-warn" d="M1270 864 L1310 938"/>
  <text class="label-warn" x="1281" y="912">不高</text>

  <path class="edge-action" d="M675 916 L675 970"/>
  <text class="label-action" x="690" y="948">Occupancy 不低仍慢</text>
  <path class="edge" d="M830 1033 L960 1033"/>
  <path class="edge" d="M1115 970 C1115 880 1040 830 960 820"/>
  <text class="label" x="998" y="906">必要时复查层级</text>

  <path class="edge-action" d="M1270 1033 C1450 1033 1470 1010 1470 850 L1470 320 C1470 220 1340 184 1270 184"/>
  <text class="label-action" x="1300" y="1020">形成优化方向后</text>
  <path class="edge-action" d="M960 184 C720 184 440 184 410 320"/>
  <text class="label-action" x="700" y="170">回到 Duration 验证</text>

  <g transform="translate(80,1118)">
    <text class="small" x="0" y="0">口诀：先看时间，再看开局；再分算力和内存；内存再拆 DRAM；都不高看 Occupancy；有 warp 还慢看 Stall；方向不明看 Roofline；最后回到时间。</text>
  </g>
</svg>
