&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;tensor-roofline-explainer&quot;);
    const svg = root.querySelector(&quot;.roofline-chart&quot;);
    const chartRoot = root.querySelector(&quot;[data-chart-root]&quot;);
    const tooltip = root.querySelector(&quot;[data-chart-tooltip]&quot;);
    const selectedLine = root.querySelector(&quot;[data-selected-line]&quot;);
    const ns = &quot;http://www.w3.org/2000/svg&quot;;

    const peak = 147.28108;
    const achieved = 21.20678;
    const xMin = 0.1;
    const xMax = 10000;
    const yMin = 1;
    const yMax = 300;
    const plot = { left: 92, right: 925, top: 34, bottom: 476 };

    const layers = [
      {
        id: &quot;l1&quot;,
        label: &quot;L1&quot;,
        ai: 3.5,
        ridge: 4,
        roof: 128.87,
        efficiency: 16.5,
        region: &quot;Memory side&quot;,
        color: &quot;var(--viz-series-1)&quot;
      },
      {
        id: &quot;l2&quot;,
        label: &quot;L2&quot;,
        ai: 9,
        ridge: 33,
        roof: 40.17,
        efficiency: 52.8,
        region: &quot;Memory side&quot;,
        color: &quot;var(--viz-series-2)&quot;
      },
      {
        id: &quot;dram&quot;,
        label: &quot;DRAM&quot;,
        ai: 1000,
        ridge: 145,
        roof: peak,
        efficiency: 14.4,
        region: &quot;Compute side&quot;,
        color: &quot;var(--viz-series-3)&quot;
      }
    ];

    const sx = value =&gt; {
      const a = Math.log10(xMin);
      const b = Math.log10(xMax);
      return plot.left + (Math.log10(value) - a) / (b - a) * (plot.right - plot.left);
    };

    const sy = value =&gt; {
      const a = Math.log10(yMin);
      const b = Math.log10(yMax);
      return plot.bottom - (Math.log10(value) - a) / (b - a) * (plot.bottom - plot.top);
    };

    const make = (tag, attrs = {}, text = &quot;&quot;) =&gt; {
      const node = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
      if (text) node.textContent = text;
      return node;
    };

    const xTicks = [0.1, 1, 10, 100, 1000, 10000];
    const yTicks = [1, 10, 100];

    xTicks.forEach(value =&gt; {
      chartRoot.appendChild(make(&quot;line&quot;, {
        x1: sx(value), y1: plot.top, x2: sx(value), y2: plot.bottom, class: &quot;grid&quot;
      }));
      chartRoot.appendChild(make(&quot;text&quot;, {
        x: sx(value), y: plot.bottom + 27, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;tick-label&quot;
      }, value &gt;= 1000 ? value.toLocaleString() : String(value)));
    });

    yTicks.forEach(value =&gt; {
      chartRoot.appendChild(make(&quot;line&quot;, {
        x1: plot.left, y1: sy(value), x2: plot.right, y2: sy(value), class: &quot;grid&quot;
      }));
      chartRoot.appendChild(make(&quot;text&quot;, {
        x: plot.left - 14, y: sy(value) + 5, &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;tick-label&quot;
      }, String(value)));
    });

    chartRoot.appendChild(make(&quot;line&quot;, {
      x1: plot.left, y1: plot.bottom, x2: plot.right, y2: plot.bottom, class: &quot;axis&quot;
    }));
    chartRoot.appendChild(make(&quot;line&quot;, {
      x1: plot.left, y1: plot.top, x2: plot.left, y2: plot.bottom, class: &quot;axis&quot;
    }));

    chartRoot.appendChild(make(&quot;text&quot;, {
      x: (plot.left + plot.right) / 2,
      y: 542,
      &quot;text-anchor&quot;: &quot;middle&quot;,
      class: &quot;axis-label&quot;
    }, &quot;Arithmetic Intensity [OP/Byte] · 对数坐标&quot;));

    chartRoot.appendChild(make(&quot;text&quot;, {
      x: 24,
      y: (plot.top + plot.bottom) / 2,
      transform: `rotate(-90 24 ${(plot.top + plot.bottom) / 2})`,
      &quot;text-anchor&quot;: &quot;middle&quot;,
      class: &quot;axis-label&quot;
    }, &quot;Performance [TOP/s] · 对数坐标&quot;));

    chartRoot.appendChild(make(&quot;line&quot;, {
      x1: plot.left,
      y1: sy(peak),
      x2: plot.right,
      y2: sy(peak),
      class: &quot;compute-roof&quot;
    }));

    chartRoot.appendChild(make(&quot;text&quot;, {
      x: plot.right - 4,
      y: sy(peak) - 10,
      &quot;text-anchor&quot;: &quot;end&quot;,
      class: &quot;mark-label&quot;
    }, &quot;Tensor Compute Roof = 147.28 TOP/s&quot;));

    layers.forEach(layer =&gt; {
      const group = make(&quot;g&quot;, { &quot;data-mark-layer&quot;: layer.id });
      const bandwidth = peak / layer.ridge;
      const startX = Math.max(xMin, yMin / bandwidth);
      const path = [
        `M ${sx(startX)} ${sy(Math.max(yMin, bandwidth * startX))}`,
        `L ${sx(layer.ridge)} ${sy(peak)}`,
        `L ${plot.right} ${sy(peak)}`
      ].join(&quot; &quot;);

      group.appendChild(make(&quot;path&quot;, {
        d: path,
        class: &quot;roof&quot;,
        stroke: layer.color
      }));

      group.appendChild(make(&quot;rect&quot;, {
        x: sx(layer.ridge) - 7,
        y: sy(peak) - 7,
        width: 14,
        height: 14,
        class: &quot;ridge&quot;,
        stroke: layer.color
      }));

      group.appendChild(make(&quot;text&quot;, {
        x: sx(layer.ridge),
        y: sy(peak) - 22,
        &quot;text-anchor&quot;: &quot;middle&quot;,
        class: &quot;mark-label&quot;
      }, `${layer.label} Ridge ≈ ${layer.ridge} OP/B`));

      const point = make(&quot;circle&quot;, {
        cx: sx(layer.ai),
        cy: sy(achieved),
        r: 10,
        class: &quot;achieved&quot;,
        fill: layer.color,
        &quot;data-point-layer&quot;: layer.id
      });
      group.appendChild(point);

      group.appendChild(make(&quot;text&quot;, {
        x: sx(layer.ai),
        y: sy(achieved) + 30,
        &quot;text-anchor&quot;: &quot;middle&quot;,
        class: &quot;mark-label&quot;
      }, `${layer.label} AI ≈ ${layer.ai}`));

      const detail = `${layer.label} · AI ≈ ${layer.ai} OP/B · Ridge ≈ ${layer.ridge} OP/B · ${layer.region} · 当前 Roof ≈ ${layer.roof.toFixed(2)} TOP/s · 达成率 ≈ ${layer.efficiency}%`;

      point.addEventListener(&quot;mouseenter&quot;, () =&gt; {
        const svgRect = svg.getBoundingClientRect();
        const rootRect = root.querySelector(&quot;.roofline-plot&quot;).getBoundingClientRect();
        const px = (sx(layer.ai) / 960) * svgRect.width + svgRect.left - rootRect.left;
        const py = (sy(achieved) / 560) * svgRect.height + svgRect.top - rootRect.top;
        tooltip.textContent = detail;
        tooltip.classList.add(&quot;is-visible&quot;);
        const width = tooltip.offsetWidth;
        const left = Math.max(8, Math.min(px - width / 2, rootRect.width - width - 8));
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${Math.max(8, py - tooltip.offsetHeight - 18)}px`;
      });

      point.addEventListener(&quot;mouseleave&quot;, () =&gt; {
        tooltip.classList.remove(&quot;is-visible&quot;);
      });

      point.addEventListener(&quot;click&quot;, () =&gt; {
        selectLayer(layer.id);
      });

      chartRoot.appendChild(group);
    });

    chartRoot.appendChild(make(&quot;line&quot;, {
      x1: plot.left,
      y1: sy(achieved),
      x2: plot.right,
      y2: sy(achieved),
      stroke: &quot;var(--muted-foreground)&quot;,
      &quot;stroke-dasharray&quot;: &quot;5 5&quot;,
      opacity: &quot;0.65&quot;
    }));

    chartRoot.appendChild(make(&quot;text&quot;, {
      x: plot.right - 4,
      y: sy(achieved) - 10,
      &quot;text-anchor&quot;: &quot;end&quot;,
      class: &quot;mark-label&quot;
    }, &quot;Achieved = 21.21 TOP/s&quot;));

    const details = {
      all: &quot;Achieved 21.21 TOP/s · Tensor Compute Roof 147.28 TOP/s · Compute Roof 达成率 14.40%&quot;,
      l1: &quot;L1 · AI≈3.5 OP/B · Ridge≈4 OP/B · Memory side · 当前 Roof≈128.87 TOP/s · 达成率≈16.5%&quot;,
      l2: &quot;L2 · AI≈9 OP/B · Ridge≈33 OP/B · Memory side · 当前 Roof≈40.17 TOP/s · 达成率≈52.8%&quot;,
      dram: &quot;DRAM · AI≈1000 OP/B · Ridge≈145 OP/B · Compute side · 当前 Roof=147.28 TOP/s · 达成率=14.4%&quot;
    };

    function selectLayer(id) {
      root.querySelectorAll(&quot;[data-layer]&quot;).forEach(button =&gt; {
        const active = button.dataset.layer === id;
        button.setAttribute(&quot;aria-pressed&quot;, String(active));
        button.classList.toggle(&quot;btn-primary&quot;, active);
      });

      root.querySelectorAll(&quot;[data-mark-layer]&quot;).forEach(group =&gt; {
        const active = id === &quot;all&quot; || group.getAttribute(&quot;data-mark-layer&quot;) === id;
        group.classList.toggle(&quot;is-dimmed&quot;, !active);
        group.classList.toggle(&quot;is-focused&quot;, id !== &quot;all&quot; &amp;&amp; active);
      });

      root.querySelectorAll(&quot;[data-table-row]&quot;).forEach(row =&gt; {
        const active = id === &quot;all&quot; || row.getAttribute(&quot;data-table-row&quot;) === id;
        row.classList.toggle(&quot;is-dimmed&quot;, !active);
      });

      selectedLine.textContent = details[id];
    }

    root.querySelectorAll(&quot;[data-layer]&quot;).forEach(button =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; selectLayer(button.dataset.layer));
    });
  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
