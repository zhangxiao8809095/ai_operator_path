<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3420" viewBox="0 0 1800 3420" role="img" aria-labelledby="title desc">
  <title id="title">AI 芯片 Kernel 转行总执行决策树</title>
  <desc id="desc">从当前能力审计出发，经过 Kernel 底座、旗舰项目、分级投递和 Offer 决策，进入 AI 芯片岗位，再向 LLM 推理系统发展的完整路线。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      text { font-family: ArialUnicode; }
      .title { font-size: 52px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 24px; font-weight: 400; fill: #475569; }
      .box-title { font-size: 27px; font-weight: 700; }
      .box-body { font-size: 21px; font-weight: 400; }
      .small-title { font-size: 23px; font-weight: 700; }
      .small-body { font-size: 18px; font-weight: 400; }
      .edge { fill: none; stroke: #475569; stroke-width: 4; marker-end: url(#arrow); }
      .edge-label { font-size: 22px; font-weight: 700; fill: #334155; }
      .root { fill: #172554; stroke: #172554; stroke-width: 3; }
      .current { fill: #2563eb; stroke: #1d4ed8; stroke-width: 7; }
      .stage { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 4; }
      .retry { fill: #fee2e2; stroke: #dc2626; stroke-width: 3; }
      .apply { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .future { fill: #ede9fe; stroke: #7c3aed; stroke-width: 3; }
      .goal { fill: #14532d; stroke: #14532d; stroke-width: 4; }
      .dark-text { fill: #0f172a; }
      .blue-text { fill: #0c4a6e; }
      .amber-text { fill: #78350f; }
      .red-text { fill: #7f1d1d; }
      .green-text { fill: #14532d; }
      .purple-text { fill: #4c1d95; }
      .white-text { fill: #ffffff; }
      .legend-text { font-size: 18px; font-weight: 500; fill: #334155; }
      .section-label { font-size: 25px; font-weight: 700; fill: #4c1d95; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="3420"/>
  <text class="title" x="900" y="72" text-anchor="middle">AI 芯片 Kernel 转行总执行决策树</text>
  <text class="subtitle" x="900" y="116" text-anchor="middle">当前总包约 50 万｜上海｜9 年 WiFi 芯片物理层/射频软件经验</text>

  <g transform="translate(315 145)">
    <rect x="0" y="0" width="30" height="22" rx="5" fill="#2563eb"/><text class="legend-text" x="42" y="18">当前位置</text>
    <rect x="205" y="0" width="30" height="22" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text class="legend-text" x="247" y="18">执行阶段</text>
    <rect x="395" y="0" width="30" height="22" rx="5" fill="#fef3c7" stroke="#d97706"/><text class="legend-text" x="437" y="18">决策门</text>
    <rect x="565" y="0" width="30" height="22" rx="5" fill="#fee2e2" stroke="#dc2626"/><text class="legend-text" x="607" y="18">回补分支</text>
    <rect x="755" y="0" width="30" height="22" rx="5" fill="#dcfce7" stroke="#16a34a"/><text class="legend-text" x="797" y="18">投递/转岗</text>
    <rect x="965" y="0" width="30" height="22" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text class="legend-text" x="1007" y="18">入行后路径</text>
  </g>

  <!-- Root -->
  <g filter="url(#shadow)">
    <rect class="root" x="300" y="205" width="800" height="115" rx="20"/>
    <text class="box-title white-text" x="700" y="249" text-anchor="middle">总目标</text>
    <text class="box-body white-text" x="700" y="286" text-anchor="middle">WiFi 芯片软件 → AI 芯片 Kernel → LLM 推理系统</text>
  </g>
  <path class="edge" d="M700 320 L700 365"/>

  <!-- Stage 0 -->
  <g filter="url(#shadow)">
    <rect class="current" x="300" y="380" width="800" height="135" rx="20"/>
    <text class="box-title white-text" x="700" y="421" text-anchor="middle">当前位置｜阶段 0：能力审计（第 1～2 周）</text>
    <text class="box-body white-text" x="700" y="460" text-anchor="middle">已有科普级广度，岗位级深度仍待证据核验</text>
    <text class="box-body white-text" x="700" y="492" text-anchor="middle">当前投递模式：市场观察</text>
  </g>
  <path class="edge" d="M700 515 L700 556"/>

  <g filter="url(#shadow)">
    <polygon class="decision" points="700,565 1100,655 700,745 300,655"/>
    <text class="box-title amber-text" x="700" y="620" text-anchor="middle">阶段 0 是否通过？</text>
    <text class="box-body amber-text" x="700" y="655" text-anchor="middle">必填项有等级和证据｜Top 8 明确</text>
    <text class="box-body amber-text" x="700" y="687" text-anchor="middle">3 个旧项目案例完成迁移翻译</text>
  </g>
  <path class="edge" d="M1100 655 L1240 655"/>
  <text class="edge-label" x="1162" y="640">否</text>
  <g filter="url(#shadow)">
    <rect class="retry" x="1260" y="590" width="470" height="130" rx="18"/>
    <text class="small-title red-text" x="1495" y="630" text-anchor="middle">继续审计</text>
    <text class="small-body red-text" x="1495" y="665" text-anchor="middle">不填写虚假完成度</text>
    <text class="small-body red-text" x="1495" y="696" text-anchor="middle">暂不消耗重点公司机会</text>
  </g>
  <path class="edge" d="M700 745 L700 790"/>
  <text class="edge-label" x="720" y="776">是</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect class="stage" x="300" y="805" width="800" height="130" rx="20"/>
    <text class="box-title blue-text" x="700" y="849" text-anchor="middle">阶段 1：Kernel 必需底座（第 3～6 周）</text>
    <text class="box-body blue-text" x="700" y="887" text-anchor="middle">C++ / CUDA / GPU 架构 / 精度 / 测试</text>
    <text class="box-body blue-text" x="700" y="917" text-anchor="middle">目标是形成可运行、可解释、可排错的工程证据</text>
  </g>
  <path class="edge" d="M700 935 L700 975"/>
  <g filter="url(#shadow)">
    <polygon class="decision" points="700,985 1100,1075 700,1165 300,1075"/>
    <text class="box-title amber-text" x="700" y="1043" text-anchor="middle">阶段 1 是否通过？</text>
    <text class="box-body amber-text" x="700" y="1080" text-anchor="middle">ENG 核心项达到 L4</text>
    <text class="box-body amber-text" x="700" y="1112" text-anchor="middle">CUDA-01～09 至少 7 项达到 L4</text>
  </g>
  <path class="edge" d="M1100 1075 L1240 1075"/>
  <text class="edge-label" x="1162" y="1060">否</text>
  <g filter="url(#shadow)">
    <rect class="retry" x="1260" y="1010" width="470" height="130" rx="18"/>
    <text class="small-title red-text" x="1495" y="1050" text-anchor="middle">只补 Top 8 中的 P0</text>
    <text class="small-body red-text" x="1495" y="1085" text-anchor="middle">不扩展 vLLM、分布式</text>
    <text class="small-body red-text" x="1495" y="1116" text-anchor="middle">完成证据后重新判断</text>
  </g>
  <path class="edge" d="M700 1165 L700 1210"/>
  <text class="edge-label" x="720" y="1195">是</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect class="stage" x="300" y="1225" width="800" height="140" rx="20"/>
    <text class="box-title blue-text" x="700" y="1268" text-anchor="middle">阶段 2：Kernel 旗舰项目（第 7～14 周）</text>
    <text class="box-body blue-text" x="700" y="1307" text-anchor="middle">L4 主案例 + L3～L4 第二算子</text>
    <text class="box-body blue-text" x="700" y="1339" text-anchor="middle">Correctness + Benchmark + NCU 根因闭环</text>
  </g>
  <path class="edge" d="M700 1365 L700 1405"/>
  <g filter="url(#shadow)">
    <polygon class="decision" points="700,1415 1100,1505 700,1595 300,1505"/>
    <text class="box-title amber-text" x="700" y="1475" text-anchor="middle">是否达到小规模试投线？</text>
    <text class="box-body amber-text" x="700" y="1512" text-anchor="middle">KRI ≥ 65</text>
    <text class="box-body amber-text" x="700" y="1544" text-anchor="middle">主案例已经形成可展示雏形</text>
  </g>
  <path class="edge" d="M1100 1505 L1240 1505"/>
  <text class="edge-label" x="1162" y="1490">否</text>
  <g filter="url(#shadow)">
    <rect class="retry" x="1260" y="1435" width="470" height="140" rx="18"/>
    <text class="small-title red-text" x="1495" y="1475" text-anchor="middle">继续完善主案例</text>
    <text class="small-body red-text" x="1495" y="1510" text-anchor="middle">补精度、边界、统计与 Profiling</text>
    <text class="small-body red-text" x="1495" y="1541" text-anchor="middle">暂不消耗重点公司机会</text>
  </g>
  <path class="edge" d="M700 1595 L700 1635"/>
  <text class="edge-label" x="720" y="1626">是</text>

  <g filter="url(#shadow)">
    <rect class="apply" x="300" y="1650" width="800" height="110" rx="20"/>
    <text class="box-title green-text" x="700" y="1693" text-anchor="middle">小规模试投｜每周 2～3 个高匹配岗位</text>
    <text class="box-body green-text" x="700" y="1730" text-anchor="middle">用真实市场反馈发现缺口，不等待全部学完</text>
  </g>
  <path class="edge" d="M700 1760 L700 1800"/>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect class="stage" x="300" y="1815" width="800" height="130" rx="20"/>
    <text class="box-title blue-text" x="700" y="1858" text-anchor="middle">阶段 3：岗位化包装与市场校准（第 15～20 周）</text>
    <text class="box-body blue-text" x="700" y="1896" text-anchor="middle">简历 + 项目报告 + 面试表达</text>
    <text class="box-body blue-text" x="700" y="1927" text-anchor="middle">重复出现的市场缺口立即进入 Top 8</text>
  </g>
  <path class="edge" d="M700 1945 L700 1985"/>
  <g filter="url(#shadow)">
    <polygon class="decision" points="700,1995 1100,2085 700,2175 300,2085"/>
    <text class="box-title amber-text" x="700" y="2053" text-anchor="middle">是否达到全面投递线？</text>
    <text class="box-body amber-text" x="700" y="2090" text-anchor="middle">KRI ≥ 80</text>
    <text class="box-body amber-text" x="700" y="2122" text-anchor="middle">5 项全面投递硬门槛全部通过</text>
  </g>
  <path class="edge" d="M1100 2085 L1240 2085"/>
  <text class="edge-label" x="1162" y="2070">否</text>
  <g filter="url(#shadow)">
    <rect class="retry" x="1260" y="2015" width="470" height="140" rx="18"/>
    <text class="small-title red-text" x="1495" y="2055" text-anchor="middle">把重复面试缺口升为 P0</text>
    <text class="small-body red-text" x="1495" y="2090" text-anchor="middle">暂停低优先级学习</text>
    <text class="small-body red-text" x="1495" y="2121" text-anchor="middle">补齐证据后重新判断</text>
  </g>
  <path class="edge" d="M700 2175 L700 2215"/>
  <text class="edge-label" x="720" y="2206">是</text>

  <g filter="url(#shadow)">
    <rect class="apply" x="300" y="2230" width="800" height="105" rx="20"/>
    <text class="box-title green-text" x="700" y="2272" text-anchor="middle">全面投递｜每周 5～8 个高匹配岗位</text>
    <text class="box-body green-text" x="700" y="2308" text-anchor="middle">内推 + 猎头 + 官网同步，并持续定点回补</text>
  </g>
  <path class="edge" d="M700 2335 L700 2375"/>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect class="stage" x="300" y="2390" width="800" height="125" rx="20"/>
    <text class="box-title blue-text" x="700" y="2433" text-anchor="middle">阶段 4：面试冲刺与 Offer 决策（第 21～26 周）</text>
    <text class="box-body blue-text" x="700" y="2471" text-anchor="middle">技术面复盘 + 团队尽调 + 年度总包统一比较</text>
    <text class="box-body blue-text" x="700" y="2502" text-anchor="middle">计划周数不是限制：合适机会可以提前接受</text>
  </g>
  <path class="edge" d="M700 2515 L700 2555"/>
  <g filter="url(#shadow)">
    <polygon class="decision" points="700,2565 1100,2660 700,2755 300,2660"/>
    <text class="box-title amber-text" x="700" y="2618" text-anchor="middle">这个 Offer 是否值得转行？</text>
    <text class="box-body amber-text" x="700" y="2655" text-anchor="middle">综合评分 ≥ 75｜没有岗位红线</text>
    <text class="box-body amber-text" x="700" y="2687" text-anchor="middle">薪资不低于个人战略降薪底线</text>
    <text class="box-body amber-text" x="700" y="2719" text-anchor="middle">工作内容能加速 Kernel → 推理系统积累</text>
  </g>
  <path class="edge" d="M1100 2660 L1240 2660"/>
  <text class="edge-label" x="1162" y="2645">否</text>
  <g filter="url(#shadow)">
    <rect class="retry" x="1260" y="2590" width="470" height="140" rx="18"/>
    <text class="small-title red-text" x="1495" y="2630" text-anchor="middle">拒绝错误岗位，继续寻找</text>
    <text class="small-body red-text" x="1495" y="2665" text-anchor="middle">不能因“AI”名称或高薪偏航</text>
    <text class="small-body red-text" x="1495" y="2696" text-anchor="middle">根据反馈回到对应缺口</text>
  </g>
  <path class="edge" d="M700 2755 L700 2795"/>
  <text class="edge-label" x="720" y="2787">是</text>

  <g filter="url(#shadow)">
    <rect class="apply" x="300" y="2810" width="800" height="110" rx="20"/>
    <text class="box-title green-text" x="700" y="2853" text-anchor="middle">第一跳完成｜进入 AI 芯片 Kernel / 算子 / 性能岗位</text>
    <text class="box-body green-text" x="700" y="2890" text-anchor="middle">从此让日常工作时间直接积累长期目标能力</text>
  </g>

  <!-- Post-entry route -->
  <text class="section-label" x="900" y="2980" text-anchor="middle">入行后 0～24 个月：沿真实工作逐步转向推理系统</text>
  <path class="edge" d="M700 2920 L700 3000 L100 3000 L100 3025"/>

  <g filter="url(#shadow)">
    <rect class="future" x="45" y="3040" width="290" height="145" rx="18"/>
    <text class="small-title purple-text" x="190" y="3080" text-anchor="middle">0～3 个月</text>
    <text class="small-body purple-text" x="190" y="3115" text-anchor="middle">芯片架构 / SDK</text>
    <text class="small-body purple-text" x="190" y="3145" text-anchor="middle">Runtime / 算子库</text>
  </g>
  <path class="edge" d="M335 3112 L365 3112"/>
  <g filter="url(#shadow)">
    <rect class="future" x="380" y="3040" width="290" height="145" rx="18"/>
    <text class="small-title purple-text" x="525" y="3080" text-anchor="middle">3～6 个月</text>
    <text class="small-body purple-text" x="525" y="3115" text-anchor="middle">真实模型算子</text>
    <text class="small-body purple-text" x="525" y="3145" text-anchor="middle">性能回归</text>
  </g>
  <path class="edge" d="M670 3112 L700 3112"/>
  <g filter="url(#shadow)">
    <rect class="future" x="715" y="3040" width="290" height="145" rx="18"/>
    <text class="small-title purple-text" x="860" y="3080" text-anchor="middle">6～12 个月</text>
    <text class="small-body purple-text" x="860" y="3115" text-anchor="middle">Attention / 低精度</text>
    <text class="small-body purple-text" x="860" y="3145" text-anchor="middle">融合 / Runtime 交互</text>
  </g>
  <path class="edge" d="M1005 3112 L1035 3112"/>
  <g filter="url(#shadow)">
    <rect class="future" x="1050" y="3040" width="290" height="145" rx="18"/>
    <text class="small-title purple-text" x="1195" y="3080" text-anchor="middle">12～18 个月</text>
    <text class="small-body purple-text" x="1195" y="3115" text-anchor="middle">模型执行 / 内存管理</text>
    <text class="small-body purple-text" x="1195" y="3145" text-anchor="middle">CUDA Graph / 调度</text>
  </g>
  <path class="edge" d="M1340 3112 L1370 3112"/>
  <g filter="url(#shadow)">
    <rect class="future" x="1385" y="3040" width="370" height="145" rx="18"/>
    <text class="small-title purple-text" x="1570" y="3080" text-anchor="middle">18～24 个月</text>
    <text class="small-body purple-text" x="1570" y="3115" text-anchor="middle">推理引擎 / 系统性能职责</text>
    <text class="small-body purple-text" x="1570" y="3145" text-anchor="middle">或内部转组</text>
  </g>
  <path class="edge" d="M1570 3185 L1570 3230 L900 3230 L900 3250"/>
  <g filter="url(#shadow)">
    <rect class="goal" x="450" y="3265" width="900" height="110" rx="22"/>
    <text class="box-title white-text" x="900" y="3308" text-anchor="middle">长期目标：LLM 推理系统 / AI Infra</text>
    <text class="box-body white-text" x="900" y="3346" text-anchor="middle">能够闭环 Kernel → Runtime → 服务性能指标</text>
  </g>
</svg>
